apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-workers
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}-workers
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: async-workers
spec:
  {{- if not .Values.workers.autoscaling.enabled }}
  replicas: {{ .Values.workers.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-workers
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-workers
    spec:
      containers:
        - name: worker
          image: "{{ .Values.workers.image.repository }}:{{ .Values.workers.image.tag }}"
          imagePullPolicy: {{ .Values.workers.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-config
            - secretRef:
                name: {{ .Release.Name }}-secrets
          env:
            - name: WORKER_CONCURRENCY
              value: "{{ .Values.workers.concurrency }}"
          resources:
            {{- toYaml .Values.workers.resources | nindent 12 }}
          volumeMounts:
            - name: artifacts-storage
              mountPath: {{ .Values.persistence.artifacts.mountPath }}
            - name: datasets-storage
              mountPath: {{ .Values.persistence.datasets.mountPath }}
      volumes:
        - name: artifacts-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-artifacts-pvc
        - name: datasets-storage
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-datasets-pvc
