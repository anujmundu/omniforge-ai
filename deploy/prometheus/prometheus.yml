# OmniForge Production Prometheus Scrape Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "omniforge-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          app: "omniforge"
          environment: "production"
