version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniforge_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://omniforge_user:omniforge_password@postgres:5432/omniforge_db
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - SECRET_KEY=omniforge-super-secret-key-for-development-32chars
      - DEBUG=true
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - omniforge-net

  postgres:
    image: postgres:16-alpine
    container_name: omniforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omniforge_user
      POSTGRES_PASSWORD: omniforge_password
      POSTGRES_DB: omniforge_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniforge_user -d omniforge_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniforge-net

  redis:
    image: redis:7-alpine
    container_name: omniforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniforge-net

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: omniforge_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    networks:
      - omniforge-net

volumes:
  postgres_data:
  redis_data:
  mlflow_data:

networks:
  omniforge-net:
    driver: bridge
