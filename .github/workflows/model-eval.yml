name: OmniForge Automated Model Regression Gate

on:
  pull_request:
    paths:
      - 'ml/**'
      - 'mlops/**'
      - 'params.yaml'
      - 'dvc.yaml'

jobs:
  model-regression-gate:
    name: Model Quality & Regression Benchmarking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Platform Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Execute Model Evaluation Gate Suite
        run: |
          pytest tests/unit/test_mlops_eval_gate.py -v
