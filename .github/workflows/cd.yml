name: OmniForge CD Pipeline & Container Deployment

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]

jobs:
  docker-build-and-scan:
    name: Build & Security Scan Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build OmniForge Gateway Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: omniforge/api-gateway:latest,omniforge/api-gateway:${{ github.sha }}
          load: true

      - name: Container Healthcheck Simulation
        run: |
          docker run -d --name test-gateway -p 8000:8000 omniforge/api-gateway:latest
          sleep 5
          docker logs test-gateway
          docker stop test-gateway
