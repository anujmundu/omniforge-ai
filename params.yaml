# OmniForge MLOps Pipeline Hyperparameters & Gate Configurations
data:
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  random_state: 42

preprocess:
  imputation_strategy: "median"
  scaling_method: "standard"
  handle_outliers: true

train:
  algorithm: "random_forest"
  n_estimators: 100
  max_depth: 12
  learning_rate: 0.05
  cross_validation_folds: 5

eval:
  min_f1_delta: 0.0
  min_accuracy_delta: 0.0
  max_latency_p95_increase_ratio: 0.10
  auto_promote_to_production: true
